name: Check-in reminders

# Every hour, ask the deployed app to push "your check-in is closing" reminders.
# Set two repository secrets to turn it on: PACTIQ_APP_URL (e.g. https://your-app.vercel.app)
# and PACTIQ_CRON_SECRET (the app's CRON_SECRET). Without them the job does nothing.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.PACTIQ_APP_URL }}
          CRON_SECRET: ${{ secrets.PACTIQ_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PACTIQ_APP_URL or PACTIQ_CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/push/cron?within=4"
