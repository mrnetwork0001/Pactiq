[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"  # QIE has PUSH0 but no Cancun opcodes (MCOPY/TLOAD)
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 512

[rpc_endpoints]
qie_mainnet = "https://rpc1mainnet.qie.digital/"
qie_mainnet_backup = "https://rpc2mainnet.qie.digital/"
qie_testnet = "https://rpc1testnet.qie.digital/"
local = "http://127.0.0.1:8545"
